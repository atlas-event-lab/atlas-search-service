server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: search-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search_db}
    username: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD:CAMBIAR_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      # Runtime traffic is multiplexed through the PgBouncer pooler; pods hold no warm
      # idle server connections (relieves cluster max_connections under HPA/KEDA scale-out).
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Batch the calendar materialization. A single hotel.created writes one row per room
          # type per night over the booking horizon (~365 x room types), and without batching
          # Hibernate sends each INSERT as its own round-trip. Batching turns thousands of
          # round-trips into tens. Origin: Experiment 07 (read model rebuild).
          batch_size: 100
        # Batching only actually groups statements when same-type statements are adjacent, so
        # both of these are load-bearing, not decoration.
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway keeps a DIRECT connection to Postgres (bypasses the PgBouncer pooler): in
    # transaction pool mode Flyway's session-level migration lock is unsafe. Reuses the
    # service role; local/compose fall back to DB_URL (no pooler there).
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/search_db}}
    user: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD:CAMBIAR_PASSWORD}
    # The CNPG pooler's automatic auth_query creates a public.user_search function in every DB,
    # so `public` is non-empty before V1 runs. Adopt the schema: baseline at 0 (NOT the default 1,
    # which would skip V1). Only fires on the first run; no-op once the history table exists; inert
    # locally where `public` is empty. See ADR-0033.
    baseline-on-migrate: true
    baseline-version: "0"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "com.atlas.search.projection.event"
        spring.json.value.default.type: com.atlas.search.projection.event.EventEnvelope
        spring.json.use.type.headers: 'false'

atlas:
  search:
    hotel:
      # Per-night hotel availability projection (ADR-0009). horizon-days MUST match Inventory's horizon
      # so the read model materializes the same window; max-stay-nights bounds the hotel search query.
      horizon-days: ${SEARCH_HOTEL_HORIZON_DAYS:365}
      purge-after-days: ${SEARCH_HOTEL_PURGE_AFTER_DAYS:7}
      max-stay-nights: ${SEARCH_HOTEL_MAX_STAY_NIGHTS:30}
      roll-interval-ms: ${SEARCH_HOTEL_ROLL_INTERVAL_MS:86400000}
      roll-initial-delay-ms: ${SEARCH_HOTEL_ROLL_INITIAL_DELAY_MS:60000}

management:
  server:
    port: 9090
  tracing:
    baggage:
      remote-fields:
        - correlationId
      correlation:
        fields:
          - correlationId
    sampling:
      # Parent-based: the entry service's decision propagates via traceparent, so the whole Saga
      # samples coherently. 0.1 default bounds span volume (esp. per-SQL JDBC spans) so Tempo
      # survives load; bump TRACING_SAMPLING to 1.0 via env for a focused debug run.
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo.atlas-observability:4318/v1/traces}
  metrics:
    distribution:
      # Native Prometheus histogram buckets for HTTP server timings, so Grafana can compute
      # p95/p99 and draw per-endpoint latency heatmaps (RED / APM). Roadmap Phase 6/7.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.atlas: INFO
    org.springframework.security: WARN
